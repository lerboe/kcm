[package]
name = "kcm"
version = "0.1.0"
edition = "2024"

[dependencies]
beeper = { path = "../beeper/beeper", default-features = false, features = ["http1"] }
libc = "0.2.191"
tokio = { version = "1.54.1", features = ["net"] }
xbpf = "0.0.6"

[build-dependencies]
beeper = { path = "../beeper/beeper", default-features = false, features = ["http1", "build"] }
xbpf = { version = "0.0.6", features = ["build"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["http2"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "rt-multi-thread", "time"] }
